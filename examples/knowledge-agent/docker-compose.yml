# Everything the example needs: Weaviate, plus Ollama for embeddings and the chat model.
#
#   docker compose up -d            # Weaviate + Ollama, and pulls the two models once
#   docker compose up -d weaviate   # Weaviate only, if Ollama already runs on your machine
#
# Host ports can be changed with WEAVIATE_HTTP_PORT, WEAVIATE_GRPC_PORT and OLLAMA_PORT.
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.7
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      # Lets Weaviate call Ollama to embed text on write and on search.
      ENABLE_MODULES: text2vec-ollama
      CLUSTER_HOSTNAME: node1
      # Set DISABLE_TELEMETRY=true to stop Weaviate sending usage telemetry.
      DISABLE_TELEMETRY: "${DISABLE_TELEMETRY:-false}"
    volumes:
      - weaviate-data:/var/lib/weaviate

  ollama:
    image: ollama/ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama

  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${EMBED_MODEL:-nomic-embed-text} && ollama pull ${CHAT_MODEL:-llama3.2}"
    restart: "no"

volumes:
  weaviate-data:
  ollama-models:
