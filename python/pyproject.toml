[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-weaviate"
dynamic = ["version"]
description = "Weaviate Storage backend for Strands Agents with built-in hybrid search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Duda Nogueira"}
]
keywords = ["strands", "agents", "ai", "weaviate", "storage", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "strands-agents>=1.64.0",
    "weaviate-client>=4.17.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/dudanogueira/strands-weaviate"
Documentation = "https://github.com/dudanogueira/strands-weaviate#readme"
Repository = "https://github.com/dudanogueira/strands-weaviate"
Issues = "https://github.com/dudanogueira/strands-weaviate/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "hatch",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# The git repo lives one level up (this is a monorepo with python/ and typescript/
# siblings under the same .git). Tell setuptools-scm where to look.
root = ".."
# Match release tags like `python-v0.1.0` and strip the `python-v` prefix.
# This lets the monorepo distinguish python and typescript releases via tag prefix.
tag_regex = "^python-v(?P<version>.+)$"
# setuptools-scm refuses non-default `root` unless given a reference file.
# `pyproject.toml` is always present next to itself, so it's a safe anchor.
relative_to = "pyproject.toml"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_weaviate"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
test-integ = "pytest -m integ {args}"
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "mypy src"
prepare = ["format", "lint", "typecheck", "test"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-m 'not integ'"
markers = [
    "integ: runs against a real Weaviate instance (see README)",
]
