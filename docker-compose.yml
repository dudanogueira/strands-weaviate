# Local Weaviate for the integration tests and examples.
# Override the host ports when 8080/50051 are taken:
#   WEAVIATE_HTTP_PORT=8090 WEAVIATE_GRPC_PORT=50061 docker compose up -d
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.7
    ports:
      - "${WEAVIATE_HTTP_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      # Test traffic is not real usage, so keep it out of Weaviate's telemetry.
      DISABLE_TELEMETRY: "true"
